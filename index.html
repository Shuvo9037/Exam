<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept Academy by Shuvo - Online Exam</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-radius: 12px;
            overflow: hidden;
            margin: 20px;
        }
        .banner {
            width: 100%;
            height: auto;
            display: block;
        }
        .header {
            padding: 15px 25px;
            text-align: center;
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            margin: 0;
            font-size: 22px;
            color: #003399;
            font-weight: 700;
        }
        .timer {
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: #ff3b3b;
            padding: 8px 18px;
            border-radius: 8px;
        }
        .instructions {
            padding: 20px 25px;
            background: #f1f5f9;
            font-weight: 600;
            font-size: 15px;
            line-height: 1.6;
        }
        .quiz-body {
            padding: 25px;
        }
        .question-block {
            margin-bottom: 25px;
            padding: 20px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            transition: 0.3s;
        }
        .question-block:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
        }
        .question-text {
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .options label {
            display: block;
            padding: 12px;
            margin-bottom: 10px;
            background: #f8fafc;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #e2e8f0;
            font-size: 16px;
        }
        .options label:hover {
            background: #e2e8f0;
        }
        .options input {
            margin-right: 12px;
            transform: scale(1.2);
        }
        .submit-btn, .review-btn {
            display: block;
            width: 90%;
            max-width: 400px;
            margin: 30px auto;
            padding: 15px;
            background: #003399;
            color: white;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        .submit-btn:hover, .review-btn:hover {
            background: #002266;
        }
        #result-screen, #review-screen {
            display: none;
            padding: 30px 25px;
            text-align: center;
        }
        .result-box {
            background: #f1f5f9;
            padding: 25px;
            border-radius: 12px;
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
        }
        .result-box span {
            font-weight: bold;
        }
        .review-block {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
        }
        .review-question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .review-option {
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 5px;
        }
        .review-correct {
            background: #e9fdf3;
            border: 1px solid #7dfbb6;
            color: #107c41;
        }
        .review-wrong {
            background: #feeceb;
            border: 1px solid #fda4a0;
            color: #bb2825;
        }
        .review-your-ans {
            font-weight: bold;
        }
        .review-score-tag {
            font-weight: bold;
            margin-top: 10px;
            display: inline-block;
            padding: 5px 12px;
            border-radius: 5px;
            color: white;
        }
        .review-correct-score {
            background: #107c41;
        }
        .review-wrong-score {
            background: #bb2825;
        }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <img src="https://i.ibb.co/example-banner-link/banner.png" alt="Concept Academy by Shuvo" class="banner">

    <div class="header" id="quiz-header">
        <h1>অনলাইন বহুনির্বাচনি পরীক্ষা</h1>
        <div class="timer" id="time">25:00</div>
    </div>

    <div class="instructions" id="instructions">
        সময়: ২৫ মিনিট | পূর্ণমান: ২৫<br>
        • সঠিক উত্তরের জন্য: +১ নম্বর<br>
        • ভুল বা উত্তর না দিলে: ০ নম্বর
    </div>

    <div class="quiz-body" id="quiz-form">
        <!-- Questions will be injected here by JavaScript -->
    </div>

    <button class="submit-btn" id="submit-btn" onclick="submitExam()">পরীক্ষা শেষ করুন</button>

    <div id="result-screen">
        <h2 style="font-size: 28px; color: #003399; margin-bottom: 25px;">পরীক্ষার ফলাফল</h2>
        <div class="result-box">
            মোট প্রশ্ন: <span>২৫</span> টি<br>
            সঠিক উত্তর: <span id="res-correct" style="color: green;">0</span> টি (+৮)<br>
            ভুল উত্তর: <span id="res-wrong" style="color: red;">0</span> টি (০)<br>
            উত্তর দেওয়া হয়নি: <span id="res-unattempted" style="color: orange;">0</span> টি (০)<br>
            <hr style="border: 0; border-top: 1px solid #ddd; margin: 15px 0;">
            প্রাপ্ত মোট নম্বর: <span id="res-score" style="font-size: 30px; color: #003399;">0</span> / 25
        </div>
        <button class="review-btn" onclick="showReview()">প্রশ্নপত্র পর্যালোচনা করুন</button>
    </div>

    <div id="review-screen">
        <h2 style="font-size: 28px; color: #003399; margin-bottom: 25px;">প্রশ্নপত্র পর্যালোচনা</h2>
        <div id="review-body">
            <!-- Review questions will be injected here -->
        </div>
    </div>
</div>

<script>
    const quizData = [
        { q: "১. শব্দের তীব্রতার একক কোনটি?", options: ["Nm⁻²", "Hz", "Wm⁻²", "Nm"], ans: 2 },
        { q: "২. অবতল আয়না ব্যবহৃত হয়— i. ডাক্তারী কাজে ii. টেলিস্কোপে iii. দৈনন্দিন জীবনে। নিচের কোনটি সঠিক?", options: ["i ও ii", "i ও iii", "ii ও iii", "i, ii ও iii"], ans: 3 },
        { q: "৩. প্রেসার কুকারে—", options: ["পানির স্ফুটনাঙ্ক কমে যায়", "তাপমাত্রা কম থাকে", "চাপ কমে যায়", "তাড়াতাড়ি সিদ্ধ হয়"], ans: 3 },
        { q: "৪. শব্দ তরঙ্গের বিস্তার তিনগুণ করলে শব্দের তীব্রতা কতগুণ হবে?", options: ["1/9 গুণ", "1/3 গুণ", "3 গুণ", "9 গুণ"], ans: 3 },
        { q: "৫. নিচের কোনটির একক ভিন্ন?", options: ["প্লবতা", "পীড়ন", "স্থিতিস্থাপক গুণাঙ্ক", "ইয়ং মডুলাস"], ans: 0 },
        { q: "৬. লক্ষ্যবস্তু অসীম ও বক্রতার কেন্দ্রের মধ্যে থাকলে অবতল দর্পণে সৃষ্ট বিম্বের প্রকৃতি কীরূপ হবে?", options: ["সদ ও উল্টো", "অসদ ও সোজা", "সদ ও সোজা", "অসদ ও উল্টো"], ans: 0 },
        { q: "৭. বাতাসে শব্দের বেগ 350 ms⁻¹। একটি বস্তু বাতাসে যে শব্দ সৃষ্টি করে তার তরঙ্গদৈর্ঘ্য 1250 cm। এর পর্যায়কাল কত?", options: ["28 s", "3.571 s", "0.28 s", "0.0357 s"], ans: 3 },
        { q: "৮. একজন ব্যক্তির উচ্চতা 168 cm। পূর্ণবিম্ব দেখার জন্য তার কমপক্ষে কত দৈর্ঘ্যের সমতল দর্পণের প্রয়োজন?", options: ["84 cm", "112 cm", "168 cm", "336 cm"], ans: 0 },
        { q: "৯. বিকৃতি— i. হচ্ছে অবস্থার পরিবর্তন ii. এর কোনো একক নেই iii. পীড়নের ব্যস্তানুপাতিক। নিচের কোনটি সঠিক?", options: ["i ও ii", "ii ও iii", "i ও iii", "i, ii ও iii"], ans: 0 },
        { q: "১০. পানিতে শব্দের বেগ কত?", options: ["1284 ms⁻¹", "1450 ms⁻¹", "1493 ms⁻¹", "5130 ms⁻¹"], ans: 1 },
        { q: "১১. লাল গোলাপ ফুল লাল দেখার কারণ— i. কেবল লাল রং প্রতিফলন করে ii. লাল রং ছাড়া সব রং শোষণ করে iii. লাল আলোর তরঙ্গদৈর্ঘ্য বেশি। নিচের কোনটি সঠিক?", options: ["i ও ii", "i ও iii", "ii ও iii", "i, ii ও iii"], ans: 0 },
        { q: "১২. ব্যারোমিটার যদি উচ্চচাপ দেখায় তাহলে বোঝা যায়—", options: ["বায়ু আর্দ্র", "আবহাওয়া ভালো", "জলীয় বাষ্প বেড়ে যায়", "ঘনত্ব কমে যায়"], ans: 1 },
        { q: "১৩. তরঙ্গস্থিত দুটি সমদশা সম্পন্ন কণার সর্বনিম্ন দূরত্ব কত?", options: ["λ/4", "λ/2", "2λ/3", "λ"], ans: 3 },
        { q: "১৪. বড় বড় টেলিস্কোপে কোনটি ব্যবহার করা হয়?", options: ["উত্তল আয়না", "অবতল আয়না", "সমতল আয়না", "উত্তল লেন্স"], ans: 1 },
        { q: "১৫. নিচের কোনটির চাপ বাড়লে গলনাঙ্ক কমে?", options: ["মোম", "বরফ", "তামা", "সোনা"], ans: 1 },
        { q: "১৬. সুরযুক্ত শব্দের বৈশিষ্ট্য নয় কোনটি?", options: ["তীব্রতা", "স্থিতিস্থাপকতা", "পিচ", "টিম্বার"], ans: 1 },
        { q: "১৭. একটি সমতল দর্পণের 10 সে.মি. সামনে লক্ষ্যবস্তু স্থাপন করলে প্রতিবিম্বটি লক্ষ্যবস্তু থেকে কত সে.মি. দূরে গঠিত হবে?", options: ["0", "5", "10", "20"], ans: 3 },
        { q: "১৮. নিচের কোন সম্পর্কটি সঠিক?", options: ["3α = 2β = γ", "Q = msΔθ", "gT² = 4π²l", "pA = RL"], ans: 2 },
        { q: "১৯. 40°C তাপমাত্রায় শব্দের প্রতিধ্বনি শোনার জন্য সর্বনিম্ন দূরত্ব কত হতে হবে?", options: ["17.7 m", "17.6 m", "17.4 m", "16.6 m"], ans: 0 },
        { q: "২০. অবতল দর্পণে রৈখিক বিবর্ধন 1 পেতে হলে বস্তুকে কোথায় স্থাপন করতে হবে?", options: ["অসীমে", "অসীম ও বক্রতার কেন্দ্রের মধ্যে", "বক্রতার কেন্দ্রে", "প্রধান ফোকাসে"], ans: 2 },
        { q: "২১. তরলের উপরিতলের ক্ষেত্রফল বৃদ্ধি পেলে, নিচের কোনটি ঘটে থাকে?", options: ["বাষ্পায়ন দ্রুত হয়", "বাষ্পায়ন হ্রাস পায়", "অপরিবর্তিত থাকে", "হ্রাস পায় পরে বৃদ্ধি পায়"], ans: 0 },
        { q: "২২. পর পর দুইটি তরঙ্গ শীর্ষের দূরত্ব 2 cm। একটি তরঙ্গ শীর্ষ ও পরবর্তী তরঙ্গ পাদের দূরত্ব কত সে. মি.?", options: ["2", "1.5", "1", "0.5"], ans: 2 },
        { q: "২৩. একটি উত্তল দর্পণে সৃষ্ট প্রতিবিম্বের ক্ষেত্রে নিচের কোনটি সঠিক?", options: ["বাস্তব ও উল্টো", "অত্যন্ত বিবর্ধিত", "লক্ষ্যবস্তুর সমান", "ফোকাসের ভিতরে অবস্থিত"], ans: 3 },
        { q: "২৪. প্যাসকেলের সূত্রের ক্ষেত্রে নিচের কোনটি সঠিক?", options: ["বল হ্রাস পায়", "আয়তন বৃদ্ধি পায়", "শক্তি বৃদ্ধি পায়", "কাজ একই থাকে"], ans: 3 },
        { q: "২৫. শব্দের তীব্রতা I এবং তরঙ্গের বিস্তার A হলে নিচের কোনটি সঠিক?", options: ["A ∝ I", "A ∝ √I", "A ∝ 1/√I", "A ∝ 1/I"], ans: 1 }
    ];

    const quizForm = document.getElementById('quiz-form');
    
    quizData.forEach((item, index) => {
        let optionsHtml = '';
        item.options.forEach((opt, optIndex) => {
            optionsHtml += `
                <label>
                    <input type="radio" name="q${index}" value="${optIndex}">
                    ${opt}
                </label>
            `;
        });

        quizForm.innerHTML += `
            <div class="question-block" id="qb${index}">
                <div class="question-text">${item.q}</div>
                <div class="options">${optionsHtml}</div>
            </div>
        `;
    });

    let timeLeft = 25 * 60; 
    let timerId = setInterval(updateTime, 1000);

    function updateTime() {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        
        if (seconds < 10) seconds = '0' + seconds;
        if (minutes < 10) minutes = '0' + minutes;
        
        document.getElementById('time').innerText = `${minutes}:${seconds}`;
        
        if (timeLeft <= 0) {
            clearInterval(timerId);
            submitExam();
        }
        timeLeft--;
    }

    let results = { correctAnswers: [], wrongAnswers: [], unattemptedQuestions: [] };

    function submitExam() {
        clearInterval(timerId);
        
        let correct = 0;
        let wrong = 0;
        let unattempted = 0;

        results.correctAnswers = [];
        results.wrongAnswers = [];
        results.unattemptedQuestions = [];

        quizData.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            
            if (selected) {
                const userAns = parseInt(selected.value);
                if (userAns === item.ans) {
                    correct++;
                    results.correctAnswers.push({ index, userAns });
                } else {
                    wrong++;
                    results.wrongAnswers.push({ index, userAns });
                }
            } else {
                unattempted++;
                results.unattemptedQuestions.push({ index });
            }
        });

        // নতুন মার্কিং নিয়ম লজিক
        let totalScore = correct;

        document.getElementById('quiz-header').style.display = 'none';
        document.getElementById('instructions').style.display = 'none';
        quizForm.style.display = 'none';
        document.getElementById('submit-btn').style.display = 'none';
        
        document.getElementById('res-correct').innerText = correct;
        document.getElementById('res-wrong').innerText = wrong;
        document.getElementById('res-unattempted').innerText = unattempted;
        document.getElementById('res-score').innerText = totalScore;
        
        document.getElementById('result-screen').style.display = 'block';
        window.scrollTo(0, 0);
    }

    function showReview() {
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('review-screen').style.display = 'block';
        
        const reviewBody = document.getElementById('review-body');
        reviewBody.innerHTML = '';

        quizData.forEach((item, index) => {
            let optionsHtml = '';
            item.options.forEach((opt, optIndex) => {
                let optionClass = 'review-option';
                let extraTag = '';

                // সঠিক উত্তরটি চিহ্নিত করা
                if (optIndex === item.ans) {
                    optionClass += ' review-correct';
                    extraTag += '<span style="float:right;">(সঠিক উত্তর)</span>';
                }

                // আপনার দেওয়া উত্তরটি চিহ্নিত করা
                const isCorrect = results.correctAnswers.some(ans => ans.index === index && ans.userAns === optIndex);
                const isWrong = results.wrongAnswers.some(ans => ans.index === index && ans.userAns === optIndex);

                if (isCorrect) {
                    extraTag += ' <span class="review-your-ans" style="color:#107c41;">(আপনার উত্তর)</span>';
                } else if (isWrong) {
                    optionClass += ' review-wrong';
                    extraTag += ' <span class="review-your-ans" style="color:#bb2825;">(আপনার উত্তর - ভুল)</span>';
                }

                optionsHtml += `<div class="${optionClass}">${opt}${extraTag}</div>`;
            });

            // নম্বর ট্যাগের জন্য লজিক
            let scoreTag = results.correctAnswers.some(ans => ans.index === index)
                ? '<span class="review-score-tag review-correct-score">নম্বর: +১</span>'
                : '<span class="review-score-tag review-wrong-score">নম্বর: ০</span>';

            reviewBody.innerHTML += `
                <div class="review-block">
                    <div class="review-question-text">${item.q}</div>
                    ${optionsHtml}
                    ${scoreTag}
                </div>
            `;
        });
        window.scrollTo(0, 0);
    }
</script>

</body>
</html>
